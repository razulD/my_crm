<!DOCTYPE html>
<html>
<head>
    <title>CRM Dashboard</title>
</head>
<body>
    <h1>Add New Client</h1>
    <form action="/add" method="POST">
        <label>Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Phone:</label>
        <input type="text" name="phone" required><br><br>

        <label>Status:</label>
        <input type="text" name="status" value="NEW" required><br><br>

        <button type="submit">Add Client</button>
    </form>

    <h2>Customer List</h2>

    <form action="/" method="GET" style="margin-bottom: 15px;">
        <input type="text" name="q" placeholder="Search by name..." value="{{ search_query }}">
        <button type="submit">Search</button>
        <a href="/">Clear</a>
    </form>

    <ul>
        {% for client in clients %}
            <li>
                {{ client[1] }} - {{ client[2] }} (Status: {{ client[3] }})
                <a href="/delete/{{ client[0] }}" style="color: red; margin-left: 10px;">[Delete]</a>
                <a href="/edit/{{ client[0] }}" style="color: blue; margin-left: 5px;">[Edit]</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
